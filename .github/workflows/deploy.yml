name: Update Tidbyt Screens

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web UI
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: tidbyt-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Render and Push Screens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev

      - name: Install Pixlet
        run: |
          curl -fsSL https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz | tar -xz
          sudo mv pixlet /usr/local/bin/
          pixlet version

      - name: Render and Push All Screens
        env:
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
        run: |
          chmod +x ./scripts/push.sh
          ./scripts/push.sh all
